version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: r10_postgres
    environment:
      POSTGRES_USER: r10_user
      POSTGRES_PASSWORD: r10_password
      POSTGRES_DB: r10_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # gateway:
  #   build: ./apps/gateway
  #   container_name: r10_gateway
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - gateway_staging:/tmp/r10_uploads # Volume ultrarrápido (preferencialmente SSD) para Staging/Tmp

volumes:
  pgdata:
  gateway_staging:
